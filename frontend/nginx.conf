server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # The client calls a same-origin /api, exactly as the Vite dev proxy serves
    # it. Keeping one origin also keeps the HTTP-only SameSite=Lax auth cookie
    # working without a CORS exception.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        # Preserve the browser's port for the API same-origin check. `$host`
        # normalizes it away, which makes localhost:5173 mutations look
        # cross-origin to the API.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis streams progress over SSE, which must not be buffered and
        # must outlive the default 60s proxy read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Deliberately above MAX_TOTAL_UPLOAD_BYTES (400 MB) plus multipart
        # overhead, so an oversized upload gets the API's own error rather than
        # a bare nginx 413.
        client_max_body_size 512m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
